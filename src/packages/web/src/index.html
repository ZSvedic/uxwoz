<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UXWoz</title>
<link rel="icon" type="image/svg+xml" href="./design/brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./design/brand/favicon-32.png">
<link rel="apple-touch-icon" href="./design/brand/apple-touch-icon.png">
<link rel="stylesheet" href="./design/index.css">
</head>
<body>
<header class="toolbar" id="toolbar">
  <nav class="bar" id="bar" aria-label="Commands">
    <button id="logo" class="logo" title="Menu" aria-label="Menu, UXWoz"><svg class="brand wm" viewBox="0 -2 123 46" width="75" height="28"><text x="0" y="40">UX</text><polyline stroke-width="6.42" points="56.55,16.61 61.14,36.79 68.02,23.03 74.9,36.79 77.83,23.95"/><path transform="translate(80.49 12.21) scale(7.89)" d="M0-1C.1-.32.32-.1 1 0 .32.1.1.32 0 1-.1.32-.32.1-1 0-.32-.1-.1-.32 0-1z"/><text x="81.54" y="40">oz</text></svg><svg class="brand mark" viewBox="0 0 50 48" width="36" height="36"><polyline stroke-width="7" points="11.5,19 16.5,41 24,26 31.5,41 34.7,27"/><path transform="translate(37.6 14.2) scale(8.6)" d="M0-1C.1-.32.32-.1 1 0 .32.1.1.32 0 1-.1.32-.32.1-1 0-.32-.1-.1-.32 0-1z"/></svg></button>
    <button id="trailBack" class="trail" title="Back to the mock or box you looked at before (⌘[)" aria-label="Back">←</button>
    <span class="pop name-pop" id="namePop">
      <button id="nameButton" class="menu-button" aria-haspopup="menu" aria-expanded="false"><span id="nameText"></span> <span class="caret"></span></button>
      <div id="dropMenu" class="menu drop-menu" role="menu" hidden>
        <div class="drop-boxes">
      <button type="button" data-look="rules" title="Rules: what every mock must follow"><i>📐</i> Rules <b></b></button>
      <button type="button" data-look="components" title="Components: parts pasted into mocks"><i>🧩</i> Components <b></b></button>
      <button type="button" data-look="data" title="Data: the sample data"><i>🗄️</i> Data <b></b></button>
      <button type="button" data-look="notes" title="The fixer's notes"><i>🕵️</i> Fixer <b></b></button>
        </div>
        <p id="dropSentence" class="sentence"></p>
        <div id="dropTree" class="drop-tree"></div>
      </div>
    </span>
    <button id="trailForward" class="trail" title="Forward again (⌘])" aria-label="Forward">→</button>
    <span id="barBoxes" class="bar-boxes">
      <button type="button" data-look="rules" title="Rules: what every mock must follow"><i>📐</i> Rules <b></b></button>
      <button type="button" data-look="components" title="Components: parts pasted into mocks"><i>🧩</i> Components <b></b></button>
      <button type="button" data-look="data" title="Data: the sample data"><i>🗄️</i> Data <b></b></button>
      <button type="button" data-look="notes" title="The fixer's notes"><i>🕵️</i> Fixer <b></b></button>
    </span>
    <button data-zoom="out" class="wide-only" title="Zoom out (⌘−)" aria-label="Zoom out">−</button>
    <span class="pop zoom-pop">
      <button id="zoomValue" class="menu-button" aria-haspopup="menu" aria-expanded="false" title="Zoom"><span id="zoomPct">100%</span> <span class="caret"></span></button>
      <div id="zoomMenu" class="menu" role="menu" hidden>
        <button class="item" data-zoom="in">Zoom in <kbd>⌘+</kbd></button>
        <button class="item" data-zoom="out">Zoom out <kbd>⌘−</kbd></button>
        <hr>
        <button class="item" data-zoom="0.5">50%</button>
        <button class="item" data-zoom="1">100% <kbd>⌘0</kbd></button>
        <button class="item" data-zoom="2">200%</button>
        <hr>
        <button class="item" data-zoom="all">Fit all <kbd>⇧1</kbd></button>
      </div>
    </span>
    <button data-zoom="in" class="wide-only" title="Zoom in (⌘+)" aria-label="Zoom in">+</button>
    <button data-zoom="1" class="wide-only" title="100%: the current mock (⌘0)" aria-label="100%"><svg viewBox="0 0 16 16" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="4.5"/><path d="M8 1v14M1 8h14"/></svg></button>
  </nav>
</header>
<aside id="menuPanel" class="side-menu" aria-label="Menu" hidden>
  <div class="side-head"><svg class="brand wm side-wm" viewBox="0 -2 123 46" width="75" height="28"><text x="0" y="40">UX</text><polyline stroke-width="6.42" points="56.55,16.61 61.14,36.79 68.02,23.03 74.9,36.79 77.83,23.95"/><path transform="translate(80.49 12.21) scale(7.89)" d="M0-1C.1-.32.32-.1 1 0 .32.1.1.32 0 1-.1.32-.32.1-1 0-.32-.1-.1-.32 0-1z"/><text x="81.54" y="40">oz</text></svg><button id="menuClose" class="close" title="Close (Esc)" aria-label="Close">✕</button></div>
  <button id="menuNew" aria-label="New project" class="item"><i>➕</i> New project</button>
  <h3 id="menuRecentHead"><i>🕘</i> Recent</h3>
  <div id="menuRecent" class="menu-recent"></div>
  <button id="menuTour" aria-label="Tour" class="item"><i>🎓</i> Tour</button>
  <div id="menuProject">
    <h3>This project</h3>
    <button class="item" id="shareMenu" aria-label="Share…" title="Make a link for a reviewer or a customer"><i>🔗</i> Share…</button>
    <button class="item" id="feedbackMenu" aria-label="Feedback" title="What reviewers said and where they clicked"><i>💬</i> Feedback</button>
    <button class="item" id="exportProject" aria-label="Export project…" title="Download the sentence, the boxes and every mock as a zip, to hand to a coding or design agent"><i>⇩</i> Export project…</button>
    <button class="item" id="exportBoxes" aria-label="Export the boxes" title="Download the Components, Rules and Data boxes as one markdown file"><i>⇩</i> Export the boxes</button>
    <button class="item" id="startOver" aria-label="Start over" title="Delete every mock and the boxes, and draw Home again"><i>↺</i> Start over</button>
    <button class="item danger" id="deleteApp" aria-label="Delete" title="Delete this project"><i>✕</i> Delete</button>
  </div>
  <h3>UXWoz</h3>
  <label class="item"><i>🎨</i> Theme <select id="themeSelect"></select></label>
  <button id="sound" class="item sound off" aria-pressed="false"><i>🔈</i> Sound: <span id="soundState">off</span></button>
  <label class="item" id="modelLine"><i>🤖</i> Model <select id="model"></select></label>
  <div id="accountLine" class="account-line" hidden></div>
  <a class="item" href="/privacy" target="_blank">Privacy</a>
  <section id="menuPage" class="menu-page share-pane" hidden>
    <div class="page-head"><button id="menuPageBack" class="item back" title="Back to the menu">←</button><h2 id="menuPageTitle"></h2></div>
    <div id="menuPageBody" class="page-body"></div>
  </section>
</aside>
<div class="workspace">
  <div class="canvas-area">
  <main id="stage" class="stage"></main>
  <div id="hint" class="hint-pill" role="status" hidden>One screen at a time: wait until this one is made.</div>
  <div id="error" class="error-pill" role="alert" hidden><span id="errorText"></span><button id="errorClose" title="Close">✕</button></div>
  </div>
  <form id="generate" class="generate">
    <div class="gen-head"><h2 id="genTitle">What should we mock up?</h2><button type="button" id="genClose" class="close" title="Close (Esc)" aria-label="Close">✕</button></div>
    <p id="genLead" class="lead" hidden>Pick an example, or describe your own.</p>
    <h3 id="ownTitle" hidden>or describe your own</h3>
    <textarea id="prompt" name="prompt" rows="2" maxlength="2000" required
      placeholder="Describe a product, e.g. a cat litter box app"></textarea>
    <div class="gen-row" id="promptTalk"></div>
    <label class="gen-for">Design for <select id="device" title="The size of the project's mocks"></select></label>
    <button type="submit" class="primary go">Draw it</button>
    <div class="gen-list" id="startersBox">
      <h3 id="startersTitle">Examples</h3>
      <div id="starters" class="starters"></div>
    </div>
  </form>
  <form id="account" class="generate account-card" hidden>
    <div class="gen-head"><p id="accountLead" class="lead"></p><button type="button" id="accountClose" class="close" title="Close (Esc)" aria-label="Close">✕</button></div>
    <label for="accountField" id="accountLabel" hidden></label>
    <input id="accountField" required>
    <button id="accountSend" type="submit" class="primary go"></button>
    <p id="accountError" class="err" role="alert" hidden></p>
    <button id="accountAgain" type="button" class="again" hidden>Send a new one</button>
    <small id="accountNote"><span id="accountNoteText"></span> <a href="/privacy" target="_blank">Privacy</a></small>
  </form>
</div>
<script type="module" src="./app.ts"></script>
</body>
</html>
