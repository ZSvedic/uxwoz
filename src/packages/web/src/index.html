<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX Woz</title>
<link rel="stylesheet" href="./shell.css">
</head>
<body>
<header class="toolbar">
  <div class="tb-left">
    <strong class="logo">UX Woz</strong>
    <button id="projectButton" type="button" class="menu-button" aria-haspopup="menu" title="Mockup: new, recent, start over, delete">
      <span id="projectName">New mockup</span> <span class="caret">▾</span></button>
    <div id="projectMenu" class="menu" role="menu" hidden>
      <button type="button" class="item" id="menuNew">＋ New mockup…</button>
      <div id="menuRecent" class="menu-recent"></div>
      <button type="button" class="item" id="exportBoxes" title="Download the Components, Rules and Data boxes as one markdown file">⇩ Export the boxes (markdown)</button>
      <div class="menu-foot" id="menuFoot">
        <button type="button" id="startOver" title="Start over: delete every screen and make the first one again">↺ Start over</button>
        <button type="button" id="deleteApp" class="danger" title="Delete this mockup">✕ Delete</button>
      </div>
    </div>
  </div>
  <div class="tb-mid">
    <button id="trailBack" type="button" class="trail" title="Back to the screen you looked at before (⌘[)" hidden>←</button>
    <button id="navButton" type="button" class="menu-button" aria-haspopup="menu" title="Every screen of this mockup" hidden>
      <span id="navName"></span> <span class="caret">▾</span></button>
    <button id="trailForward" type="button" class="trail" title="Forward again (⌘])" hidden>→</button>
    <div id="navMenu" class="menu nav-menu" role="menu" hidden></div>
  </div>
  <div class="tb-right zoom">
    <span class="box-nav">
      <button type="button" data-box="components" title="Show the Components box; the number counts what is new since you last looked">Components <b></b></button>
      <button type="button" data-box="rules" title="Show the Rules box; the number counts what is new since you last looked">Rules <b></b></button>
      <button type="button" data-box="data" title="Show the Data box; the number counts what is new since you last looked">Data <b></b></button>
      <button type="button" data-box="notes" title="Show the fixer's notes; the number counts its visits since you last looked">Notes <b></b></button>
    </span>
    <button id="zoomOut" type="button" class="wide-only" title="Zoom out (⌘−)">−</button>
    <button id="zoomValue" type="button" class="menu-button" aria-haspopup="menu" title="Zoom"><span id="zoomPct">100%</span> <span class="caret">▾</span></button>
    <button id="zoomIn" type="button" class="wide-only" title="Zoom in (⌘+)">+</button>
    <button id="fitScreen" type="button" class="wide-only" title="Fit screen (⇧2)">⤢</button>
    <div id="zoomMenu" class="menu zoom-menu" role="menu" hidden>
      <button type="button" class="item" data-zoom="in">Zoom in <kbd>⌘+</kbd></button>
      <button type="button" class="item" data-zoom="out">Zoom out <kbd>⌘−</kbd></button>
      <hr>
      <button type="button" class="item" data-zoom="0.5">50% </button>
      <button type="button" class="item" data-zoom="1">100% <kbd>⌘0</kbd></button>
      <button type="button" class="item" data-zoom="2">200% </button>
      <hr>
      <button type="button" class="item" data-zoom="all">Fit all <kbd>⇧1</kbd></button>
      <button type="button" class="item" data-zoom="screen">Fit screen <kbd>⇧2</kbd></button>
      <button type="button" class="item" data-zoom="width">Fit screen width <kbd>⇧3</kbd></button>
    </div>
  </div>
</header>
<div class="workspace">
  <div class="canvas-area">
  <main id="stage" class="stage"></main>
  <div id="hint" class="hint-pill" role="status" hidden>One screen at a time: wait until this one is made.</div>
  <div id="error" class="error-pill" role="alert" hidden><span id="errorText"></span><button id="errorClose" type="button" title="Close">✕</button></div>
  </div>
  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-head">
      <div class="tabs" role="tablist">
        <button id="tabEdit" type="button" role="tab" data-tab="edit">✎ Edit</button>
        <button id="tabInfo" type="button" role="tab" data-tab="info">ⓘ Info</button>
      </div>
      <button id="drawerClose" type="button" class="close" title="Close (Esc)">✕</button>
    </div>
    <p id="drawerName" class="drawer-name"></p>
    <form id="editPane" class="pane">
      <label for="change">What should change?</label>
      <textarea id="change" rows="4" maxlength="1000" placeholder="e.g. Show one level indicator, not four"></textarea>
      <button id="makeChange" type="submit" class="primary">Make the change</button>
      <h3>Past changes</h3>
      <ol id="history" class="history" reversed></ol>
    </form>
    <div id="infoPane" class="pane"><dl id="info" class="info"></dl></div>
  </aside>
  <form id="generate" class="generate">
    <h2>What should we mock up?</h2>
    <textarea id="prompt" name="prompt" rows="2" maxlength="2000" required
      placeholder="Describe a product, e.g. a coffee shop ordering app"></textarea>
    <div class="gen-row">
      <label>Model <select id="model"></select></label>
      <label>Device <select id="device" title="What the mockup's screens are designed for"></select></label>
      <label>Theme <select id="theme"></select></label>
    </div>
    <button id="go" type="submit" class="primary go">Generate</button>
    <div class="gen-list">
      <h3>Templates</h3>
      <div id="templates" class="chips">
        <button type="button" class="example">A coffee shop ordering app</button>
        <button type="button" class="example">A mortgage calculator with a yearly balance chart</button>
        <button type="button" class="example">A todo list with filters</button>
        <button type="button" class="example" data-prompt="cute android app for controling Schrodinger 3000, which is an automatic cat litter box (cleans the sand automatically), has automatic water dispenser, dry food dispenser, and wet food dispenser, and a camera to track your cat!!">Schrodinger 3000 cat app</button>
        <button type="button" class="example" data-prompt="A food delivery app: browse restaurants, a restaurant's menu, cart, checkout and live order tracking">Food delivery app</button>
        <button type="button" class="example" data-prompt="A habit tracker: today's habits, a habit's detail with a streak calendar, add a habit, weekly stats and settings">Habit tracker</button>
      </div>
    </div>
    <div class="gen-list" id="recentBox" hidden>
      <h3>Recent mockups</h3>
      <div id="recent" class="recent"></div>
    </div>
  </form>
</div>
<script type="module" src="./app.ts"></script>
</body>
</html>
