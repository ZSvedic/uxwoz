<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX Woz</title>
<link rel="stylesheet" href="./shell.css">
</head>
<body>
<header class="toolbar">
  <div class="tb-left">
    <strong class="logo">UX Woz</strong>
    <button id="newMockup" type="button" title="Make a new mockup">New mockup</button>
  </div>
  <div class="tb-mid"></div>
  <div class="tb-right zoom">
    <button id="zoomOut" type="button" title="Zoom out (⌘−)">−</button>
    <button id="zoomValue" type="button" title="Zoom">100%</button>
    <button id="zoomIn" type="button" title="Zoom in (⌘+)">+</button>
    <button id="fitScreen" type="button" title="Fit screen (⇧2)">⤢</button>
  </div>
</header>
<div class="workspace">
  <div class="canvas-area">
  <main id="stage" class="stage"></main>
  <div id="status" class="status" hidden><span id="statusText"></span><button id="statusClose" type="button" title="Close" hidden>✕</button></div>
  </div>
  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-head">
      <div class="tabs" role="tablist">
        <button id="tabEdit" type="button" role="tab" data-tab="edit">✎ Edit</button>
        <button id="tabInfo" type="button" role="tab" data-tab="info">ⓘ Info</button>
      </div>
      <button id="drawerClose" type="button" class="close" title="Close (Esc)">✕</button>
    </div>
    <p id="drawerName" class="drawer-name"></p>
    <form id="editPane" class="pane">
      <label for="change">What should change?</label>
      <textarea id="change" rows="4" maxlength="1000" placeholder="e.g. Show one level indicator, not four"></textarea>
      <button id="makeChange" type="submit" class="primary">Make the change</button>
      <h3>Past changes</h3>
      <ol id="history" class="history" reversed></ol>
    </form>
    <div id="infoPane" class="pane"><dl id="info" class="info"></dl></div>
  </aside>
  <form id="generate" class="generate">
    <h2>What should we mock up?</h2>
    <textarea id="prompt" name="prompt" rows="2" maxlength="2000" required
      placeholder="Describe a product, e.g. a coffee shop ordering app"></textarea>
    <div class="gen-row">
      <button id="go" type="submit" class="primary">Generate</button>
      <label>Model <select id="model"></select></label>
      <label>Device <select id="device" title="What new screens are designed for"></select></label>
      <label>Theme <select id="theme"></select></label>
    </div>
    <div class="gen-list">
      <h3>Templates</h3>
      <div id="templates" class="chips">
        <button type="button" class="example">A coffee shop ordering app</button>
        <button type="button" class="example">A mortgage calculator with a yearly balance chart</button>
        <button type="button" class="example">A todo list with filters</button>
        <button type="button" class="example" data-prompt="cute android app for controling Schrodinger 3000, which is an automatic cat litter box (cleans the sand automatically), has automatic water dispenser, dry food dispenser, and wet food dispenser, and a camera to track your cat!!">Schrodinger 3000 cat app</button>
        <button type="button" class="example" data-prompt="A food delivery app: browse restaurants, a restaurant's menu, cart, checkout and live order tracking">Food delivery app</button>
        <button type="button" class="example" data-prompt="A habit tracker: today's habits, a habit's detail with a streak calendar, add a habit, weekly stats and settings">Habit tracker</button>
      </div>
    </div>
    <div class="gen-list" id="recentBox" hidden>
      <h3>Recent mockups</h3>
      <div id="recent" class="recent"></div>
    </div>
  </form>
</div>
<script type="module" src="./app.ts"></script>
</body>
</html>
