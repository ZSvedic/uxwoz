<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX Woz</title>
<link rel="icon" type="image/svg+xml" href="./design/brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./design/brand/favicon-32.png">
<link rel="apple-touch-icon" href="./design/brand/apple-touch-icon.png">
<link rel="stylesheet" href="./design/index.css">
</head>
<body>
<header class="toolbar" id="toolbar">
  <nav class="bar" aria-label="Commands">
  <div class="tb-left">
    <div class="logo"><img src="./design/brand/logo.svg" alt="" width="36" height="36"><b>UX <span>Woz</span></b></div>
    <button id="menuNew" class="deck" title="New mockup" aria-label="New mockup">+</button>
    <i class="sep new-sep"></i>
    <span class="pop">
    <button id="projectButton" class="menu-button" aria-haspopup="menu" title="Mockup: recent, start over, delete">
      <span id="projectName">New mockup</span> <span class="caret"></span></button>
    <div id="projectMenu" class="menu" role="menu" hidden>
      <div id="menuRecent" class="menu-recent"></div>
      <button class="item" id="exportBoxes" title="Download the Components, Rules and Data boxes as one markdown file">⇩ Export the boxes (markdown)</button>
      <button class="item" id="shareMenu" title="Make a link for a reviewer or a customer">⇗ Share…</button>
      <button class="item" id="feedbackMenu" title="What reviewers said and where they clicked">☰ Feedback</button>
      <div class="menu-foot" id="menuFoot">
        <button id="startOver" title="Start over: delete every screen and make the first one again">↺ Start over</button>
        <button id="deleteApp" class="danger" title="Delete this mockup">✕ Delete</button>
      </div>
    </div>
    </span>
    <i class="sep nav-sep"></i>
    <span class="pop nav-pop">
    <button id="trailBack" class="trail" title="Back to the screen you looked at before (⌘[)" hidden>←</button>
    <button id="navButton" class="menu-button" aria-haspopup="menu" title="Every screen of this mockup" hidden>
      <span id="navName"></span> <span class="caret"></span></button>
    <button id="trailForward" class="trail" title="Forward again (⌘])" hidden>→</button>
    <div id="navMenu" class="menu nav-menu" role="menu" hidden></div>
    </span>
  </div>
  <div class="tb-mid">
    <i class="sep box-sep"></i>
    <span class="pop">
    <button id="boxesButton" class="menu-button" aria-haspopup="menu" title="Show a box">Boxes <b id="boxesSum"></b> <span class="caret"></span></button>
    <span class="box-nav menu" id="boxNav" title="Show a box; the number counts what is new since you last looked" hidden>
      <button data-box="rules">Rules <b></b></button><i class="sep"></i>
      <button data-box="notes">Fixer <b></b></button><i class="sep"></i>
      <button data-box="components">Components <b></b></button><i class="sep"></i>
      <button data-box="data">Data <b></b></button>
    </span>
    </span>
  </div>
  <div class="tb-right">
    <i class="sep"></i>
    <span class="pop">
      <button id="themeButton" class="menu-button" aria-haspopup="menu" title="Theme: how every screen looks"><span id="themeName"></span> <span class="caret"></span></button>
      <div id="themeMenu" class="menu" role="menu" hidden></div>
    </span>
    <i class="sep"></i>
    <button data-zoom="out" class="wide-only" title="Zoom out (⌘−)"><svg class="icon" viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
    <span class="pop">
    <button id="zoomValue" class="menu-button" aria-haspopup="menu" title="Zoom"><span id="zoomPct">100%</span> <span class="caret"></span></button>
    <div id="zoomMenu" class="menu" role="menu" hidden>
      <button class="item" data-zoom="in">Zoom in <kbd>⌘+</kbd></button>
      <button class="item" data-zoom="out">Zoom out <kbd>⌘−</kbd></button>
      <hr>
      <button class="item" data-zoom="0.5">50% </button>
      <button class="item" data-zoom="1">100% <kbd>⌘0</kbd></button>
      <button class="item" data-zoom="2">200% </button>
      <hr>
      <button class="item" data-zoom="all">Fit all <kbd>⇧1</kbd></button>
      <button class="item" data-zoom="screen">Fit screen <kbd>⇧2</kbd></button>
      <button class="item" data-zoom="width">Fit screen width <kbd>⇧3</kbd></button>
    </div>
    </span>
    <button data-zoom="in" class="wide-only" title="Zoom in (⌘+)"><svg class="icon" viewBox="0 0 16 16"><path d="M3 8h10M8 3v10"/></svg></button>
    <button data-zoom="screen" class="wide-only" title="Fit screen (⇧2)"><svg class="icon" viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
    <i class="sep"></i>
    <button id="sound" class="sound off" title="Sounds" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
    <span class="pop" id="accountPop" hidden>
      <button id="accountButton" class="menu-button" aria-haspopup="menu" title="Your account"><span id="accountName"></span><span id="accountLetter" class="dot" hidden></span><svg id="accountIcon" class="icon" viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.8"/><path d="M2.5 14c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5"/></svg></button>
      <div id="accountMenu" class="menu" role="menu" hidden></div>
    </span>
  </div>
  </nav>
</header>
<div class="workspace">
  <div class="canvas-area">
  <main id="stage" class="stage"></main>
  <div id="hint" class="hint-pill" role="status" hidden>One screen at a time: wait until this one is made.</div>
  <div id="error" class="error-pill" role="alert" hidden><span id="errorText"></span><button id="errorClose" title="Close">✕</button></div>
  </div>
  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-head">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="edit">✎ Edit</button>
        <button role="tab" data-tab="info">ⓘ Info</button>
        <button role="tab" data-tab="comments" id="commentsTab">💬 Comments</button>
      </div>
      <button id="drawerClose" class="close" title="Close (Esc)">✕</button>
    </div>
    <p id="drawerName" class="drawer-name"></p>
    <form id="editPane" class="pane">
      <label for="change" id="changeLabel">What should change?</label>
      <textarea id="change" rows="4" maxlength="1000" placeholder="e.g. Show one level indicator, not four"></textarea>
      <button id="makeChange" type="submit" class="primary">Make the change</button>
      <h3>Past changes</h3>
      <ol id="history" class="history" reversed></ol>
    </form>
    <div id="infoPane" class="pane"><dl id="info" class="info"></dl></div>
    <div id="commentsPane" class="pane comments-pane" hidden></div>
    <div id="sharePane" class="pane share-pane" hidden></div>
  </aside>
  <form id="generate" class="generate">
    <h2 id="genTitle">What should we mock up?</h2>
    <p id="genLead" class="lead" hidden>Pick an example and watch it drawn, or describe your own.</p>
    <h3 id="ownTitle" hidden>or describe your own</h3>
    <textarea id="prompt" name="prompt" rows="2" maxlength="2000" required
      placeholder="Describe a product, e.g. a coffee shop ordering app"></textarea>
    <div class="gen-row">
      <label>Model <select id="model"></select></label>
      <label>Device <select id="device" title="What the mockup's screens are designed for"></select></label>
    </div>
    <button type="submit" class="primary go">Generate</button>
    <div class="gen-list" id="startersBox">
      <h3 id="startersTitle">Starters</h3>
      <div id="starters" class="starters"></div>
    </div>
    <div class="gen-list" id="recentBox" hidden>
      <h3>Recent mockups</h3>
      <div id="recent" class="recent"></div>
    </div>
  </form>
  <form id="account" class="generate account-card" hidden>
    <p id="accountLead" class="lead"></p>
    <label for="accountField" id="accountLabel" hidden></label>
    <input id="accountField" required>
    <button id="accountSend" type="submit" class="primary go"></button>
    <p id="accountError" class="err" role="alert" hidden></p>
    <button id="accountAgain" type="button" class="again" hidden>Send a new one</button>
    <small id="accountNote"><span id="accountNoteText"></span> <a href="/privacy" target="_blank">Privacy</a></small>
  </form>
</div>
<script type="module" src="./app.ts"></script>
</body>
</html>
