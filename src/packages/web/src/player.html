<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX Woz mockup</title>
<meta property="og:title" content="UX Woz mockup">
<meta property="og:description" content="A clickable mockup to try: click through its screens and say what you think.">
<meta property="og:image" content="/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="./design/brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./design/brand/favicon-32.png">
<link rel="apple-touch-icon" href="./design/brand/apple-touch-icon.png">
<link rel="stylesheet" href="./design/tokens.css">
<link rel="stylesheet" href="./design/base.css">
<link rel="stylesheet" href="./design/player.css">
</head>
<body>
<header class="bar">
  <img class="hat" src="./design/brand/logo.svg" alt="UX Woz" width="32" height="32">
  <button id="back" title="Back to the screen before" hidden>← Back</button>
  <div class="where"><b id="name">Loading…</b><div id="trail" class="trail"></div></div>
</header>
<main class="stage" id="stage">
  <div class="fit" id="fit"><div class="device" id="device"><iframe id="frame" title="Mockup screen"></iframe><div class="pins" id="pins"></div></div></div>
  <aside class="margin" id="margin" hidden>
    <p class="hint" id="hint">Comment pins what you say to a part of the screen.</p>
    <button class="slip whole" id="whole" hidden>The whole screen</button>
    <form class="slip" id="nameCard" hidden>
      <label for="who">Your name, so the owner knows who said it</label>
      <input id="who" maxlength="60" autocomplete="name">
      <div class="actions"><button type="submit" class="primary">Continue</button></div>
    </form>
    <form class="slip" id="composer" hidden>
      <div class="head"><span class="dot" id="composerPin"></span><small id="composerAbout"></small></div>
      <p class="ask" id="composerQ"></p>
      <textarea id="composerText" rows="3" maxlength="1000"></textarea>
      <div class="actions"><button type="button" id="composerCancel">Cancel</button><button type="submit" class="primary">Send</button></div>
    </form>
    <ol class="slips" id="slips"></ol>
  </aside>
</main>
<div id="note" class="note" hidden></div>
<div class="dock">
<div id="toast" class="toast" role="status" hidden></div>
<footer id="tools" class="tools" hidden>
  <button id="up" title="I like this screen">👍</button>
  <button id="down" title="I do not like this screen">👎</button>
  <button id="comment" aria-pressed="false" title="Then click the part you mean">Comment</button>
  <button id="done" class="primary">Done</button>
</footer>
</div>
<script type="module" src="./player.ts"></script>
</body>
</html>
