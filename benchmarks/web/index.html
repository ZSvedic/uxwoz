<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX Woz Bench</title>
<link rel="stylesheet" href="/vendor/pico.classless.min.css">
<style>
  body > main { max-width: 1200px; }
  table { font-size: 0.85rem; }
  td, th { white-space: nowrap; }
  td.wrap { white-space: normal; }
  .pill { display: inline-block; border-radius: 999px; padding: 0 0.5em; margin-right: 2px; font-size: 0.8rem; }
  .pass { background: #d3f9d8; color: #2b8a3e; } .partial { background: #fff3bf; color: #8a6d00; } .fail { background: #ffe3e3; color: #c92a2a; }
  .muted { color: #6c757d; font-size: 0.85rem; }
  pre { max-height: 520px; overflow: auto; font-size: 0.8rem; }
  .preview iframe { width: 100%; height: 900px; border: 1px solid #dee2e6; }
  .preview img { max-width: 100%; border: 1px solid #dee2e6; }
  .tabs button { width: auto; display: inline-block; padding: 0.3em 0.8em; margin-right: 0.3em; font-size: 0.85rem; }
  tr[data-href] { cursor: pointer; }
</style>
</head>
<body>
<main id="app"><p aria-busy="true">Loading…</p></main>
<script>
const app = document.getElementById('app')
const api = (path, init) => fetch(path, { headers: { 'Content-Type': 'application/json' }, ...init }).then(async (r) => {
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText)
  return r.json()
})
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const ms = (v) => (v == null ? '—' : `${(v / 1000).toFixed(1)} s`)
const usd = (v) => (v == null ? '—' : `$${v < 0.01 ? v.toFixed(5) : v.toFixed(4)}`)
const pill = (g, text) => `<span class="pill ${g}">${esc(text ?? g)}</span>`
const counts = (c) => ['pass', 'partial', 'fail'].filter((g) => c[g]).map((g) => pill(g, c[g])).join('')
let config, poll

async function home() {
  const [summary, runs] = await Promise.all([api('/api/summary'), api('/api/runs')])
  const k = summary.constants
  app.innerHTML = `
    <h1>UX Woz UI generation benchmark <small class="muted">lite</small></h1>
    <p class="muted">${esc(config.format)} · ${Object.keys(config.models).length} models · ${Object.keys(config.tasks).length} tasks · system prompt ${config.system_prompt_tokens} tokens</p>
    <article>
      <h3>Summary over all stored runs</h3>
      <table>
        <thead><tr><th>#</th><th>Model</th><th>Score</th>${Object.values(config.tasks).map((t) => `<th>${esc(t.label)}</th>`).join('')}
          <th>Correct C</th><th>Time t</th><th>Cost/screen</th><th>Speed S</th><th>Price P</th><th>Attempts</th></tr></thead>
        <tbody>${summary.rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(config.models[r.model].label)}${r.model === config.default_model ? ' <small class="muted">default</small>' : ''}</td>
          <td><strong>${r.score.toFixed(0)}</strong></td>${Object.keys(config.tasks).map((t) => `<td>${counts(r.tasks[t])}</td>`).join('')}
          <td>${r.C.toFixed(2)}</td><td>${r.t.toFixed(1)} s</td><td>${usd(r.cost)}</td><td>${r.S.toFixed(2)}</td><td>${r.P.toFixed(2)}</td><td>${r.n}</td></tr>`).join('')
          || `<tr><td colspan="12" class="muted">No model has runs on all three tasks yet.</td></tr>`}</tbody>
      </table>
      <p class="muted"><b>Score = 100 × C² × S × P</b>, 0 when C &lt; ${k.min_correctness}. C: (Pass + ${k.partial_credit} × Partial) / attempts, averaged over tasks.
        S: 1 at ≤ ${k.fast_s} s to fully rendered, 0 at ≥ ${k.budget_s} s. P: 1 at ≤ $${k.cheap_usd}/screen, down to ${1 - k.max_price_penalty} at ≥ $${k.pricey_usd}.
        Cells count ${pill('pass', 'Pass')}${pill('partial', 'Partial')}${pill('fail', 'Fail')} attempts.</p>
    </article>
    <article>
      <h3>New run</h3>
      <form id="new">
        <label>Task <select name="task">${Object.entries(config.tasks).map(([id, t]) => `<option value="${id}">${esc(t.label)}</option>`).join('')}</select></label>
        <fieldset><legend>Models</legend>${Object.entries(config.models).map(([id, mo]) =>
          `<label><input type="checkbox" name="models" value="${id}" checked> ${esc(mo.label)} <small class="muted">reasoning ${esc(mo.reasoning_label)}</small></label>`).join('')}</fieldset>
        <label>Repetitions <input type="number" name="reps" value="3" min="1" max="20"></label>
        <button type="submit" ${config.busy ? 'disabled' : ''}>Start run</button>
        <p id="err" class="muted"></p>
      </form>
    </article>
    <article>
      <h3>Runs</h3>
      <table><thead><tr><th>Started</th><th>Task</th><th>Models × reps</th><th>Status</th><th>Grades</th></tr></thead>
      <tbody>${runs.map((r) => `<tr data-href="#/run/${r.id}"><td>${new Date(r.created_at).toLocaleString()}</td><td>${esc(config.tasks[r.task]?.label ?? r.task)}</td>
        <td>${r.models.length} × ${r.reps}</td><td>${esc(r.status)}</td><td class="muted">${esc(r.id)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No runs yet.</td></tr>'}</tbody></table>
    </article>`
  document.getElementById('new').onsubmit = async (e) => {
    e.preventDefault()
    const f = new FormData(e.target)
    try {
      const run = await api('/api/runs', { method: 'POST', body: JSON.stringify({ task: f.get('task'), models: f.getAll('models'), reps: Number(f.get('reps')) }) })
      location.hash = `#/run/${run.id}`
    } catch (err) { document.getElementById('err').textContent = err.message }
  }
}

async function runPage(id) {
  const run = await api(`/api/runs/${id}`)
  const rows = [...run.attempts].sort((a, b) => a.model.localeCompare(b.model) || a.rep - b.rep)
  app.innerHTML = `
    <p><a href="#/">← Summary and runs</a></p>
    <h1>${esc(config.tasks[run.task]?.label ?? run.task)} <small class="muted">${esc(run.id)} · ${esc(run.status)}</small></h1>
    <p class="muted">${run.attempts.length}/${run.order.length} attempts · seed ${run.seed} · code ${esc(run.code_version)}${run.recheck ? ' · re-checked' : ''}</p>
    ${run.error ? `<pre>${esc(run.error)}</pre>` : ''}
    <table><thead><tr><th>Model</th><th>Rep</th><th>Grade</th><th>Defects / reason</th><th>First visible</th><th>Fully rendered</th><th>Output tok</th><th>Cost</th></tr></thead>
    <tbody>${rows.map((a) => `<tr data-href="#/attempt/${a.id}"><td>${esc(config.models[a.model]?.label ?? a.model)}</td><td>${a.rep}</td><td>${pill(a.grade.grade)}</td>
      <td class="wrap">${esc(a.grade.reason || a.grade.defects.join('; '))}</td><td>${ms(a.timings.first_visible_ui_ms)}</td><td>${ms(a.timings.fully_rendered_ms)}</td>
      <td>${a.usage?.output_tokens ?? '—'}</td><td>${usd(a.cost_usd)}</td></tr>`).join('')}</tbody></table>`
  if (run.status === 'running' || run.status === 'queued') poll = setTimeout(() => route(), 2000)
}

async function attemptPage(id) {
  const a = await api(`/api/attempts/${id}`)
  const t = a.timings
  const views = { render: 'Live render', replay: 'Replay stream', shot: 'Screenshot', ...(a.screenshot_after ? { after: 'After inputs changed' } : {}) }
  app.innerHTML = `
    <p><a href="#/run/${a.run_id}">← run ${esc(a.run_id)}</a></p>
    <h1>${esc(config.models[a.model]?.label ?? a.model)} · ${esc(a.task)} · rep ${a.rep} ${pill(a.grade.grade)}</h1>
    <p>${esc(a.grade.reason || a.grade.defects.join('; ') || 'No defects.')}</p>
    <p class="muted">first token ${ms(t.first_token_ms)} · first visible ${ms(t.first_visible_ui_ms)} · content complete ${ms(t.content_complete_ms)} · fully rendered ${ms(t.fully_rendered_ms)}
      · ${a.usage?.output_tokens ?? '—'} output tokens (${a.output_tokens_per_s ?? '—'} tok/s) · ${usd(a.cost_usd)} <small>(${esc(a.cost_source)})</small>
      · served ${esc(a.actual?.model)} ${a.actual?.service_tier ? '/ ' + esc(a.actual.service_tier) : ''}</p>
    <article class="preview">
      <div class="tabs">${Object.entries(views).map(([k, v]) => `<button data-view="${k}">${v}</button>`).join('')}</div>
      <div id="view"></div>
    </article>
    <details><summary>Interaction test (${a.interactive?.passed ?? 0}/${a.interactive?.total ?? '—'})</summary><pre>${esc(JSON.stringify(a.interactive, null, 1))}</pre></details>
    <details><summary>Generated source (raw)</summary><pre>${esc(a.source)}</pre></details>
    ${a.errors?.length ? `<details><summary>Errors (${a.errors.length})</summary><pre>${esc(JSON.stringify(a.errors, null, 1))}</pre></details>` : ''}`
  const show = (v) => {
    document.getElementById('view').innerHTML =
      v === 'shot' ? `<img src="${a.screenshot}" alt="screenshot">`
        : v === 'after' ? `<img src="${a.screenshot_after}" alt="after inputs changed">`
        : `<iframe src="/harness.html?attempt=${a.id}&mode=${v === 'replay' ? 'replay' : 'static'}" title="render"></iframe>`
  }
  app.querySelectorAll('[data-view]').forEach((b) => (b.onclick = () => show(b.dataset.view)))
  show('render')
}

async function route() {
  clearTimeout(poll)
  config = await api('/api/config')
  const [, page, id] = location.hash.split('/')
  try {
    await (page === 'run' ? runPage(id) : page === 'attempt' ? attemptPage(id) : home())
  } catch (e) { app.innerHTML = `<p><a href="#/">← Home</a></p><p>${esc(e.message)}</p>` }
}
app.addEventListener('click', (e) => {
  const tr = e.target.closest('tr[data-href]')
  if (tr) location.hash = tr.dataset.href
})
window.addEventListener('hashchange', route)
route()
</script>
</body>
</html>
