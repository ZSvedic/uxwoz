[project]
name = "uxwoz-bench"
version = "0.1.0"
description = "UX Woz UI generation benchmark (lite): HTML + vanilla JS + Pico.css on three models"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "tiktoken>=0.8",
  "playwright>=1.48",
  "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
