# Fly.io: one always-on machine with a 1 GB volume for the screen cache. See README, "Host it".
# The keys and UXWOZ_OWNER are secrets (`fly secrets set`), never written here.
app = "uxwoz"
primary_region = "fra"

[http_service]
  internal_port = 8080
  force_https = true
  # One process writes the cache file, so one machine, and it stays on: filing runs after a pick.
  auto_stop_machines = "off"
  auto_start_machines = false

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[mounts]
  source = "uxwoz_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
